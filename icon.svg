<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D5BFF"/>
      <stop offset="1" stop-color="#0EA672"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06264d" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#sh)">
    <!-- done: a ticked bar -->
    <rect x="232" y="292" width="560" height="112" rx="56" fill="#fff"/>
    <circle cx="288" cy="348" r="36" fill="#0EA672"/>
    <path d="M270 349 l13 13 l25 -27" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- next -->
    <rect x="232" y="456" width="560" height="112" rx="56" fill="#fff" fill-opacity=".9"/>
    <circle cx="288" cy="512" r="30" fill="none" stroke="#2D5BFF" stroke-opacity=".55" stroke-width="10"/>
    <!-- later: shorter -->
    <rect x="232" y="620" width="340" height="112" rx="56" fill="#fff" fill-opacity=".7"/>
    <circle cx="288" cy="676" r="30" fill="none" stroke="#2D5BFF" stroke-opacity=".4" stroke-width="10"/>
  </g>
</svg>
