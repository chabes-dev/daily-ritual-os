<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23fff'/%3E%3Crect x='11' y='14' width='42' height='8' rx='4' fill='%231A73E8'/%3E%3Crect x='11' y='28' width='42' height='8' rx='4' fill='%231E8E3E'/%3E%3Crect x='11' y='42' width='24' height='8' rx='4' fill='%23FBBC04'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --serif:'Fraunces', Georgia, serif;
  --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r:12px;
  --shadow:0 1px 2px rgba(60,64,67,.10), 0 6px 18px -10px rgba(60,64,67,.25);
  --shadow-2:0 2px 6px rgba(60,64,67,.12), 0 14px 34px -14px rgba(60,64,67,.4);
  --blue:#1A73E8; --green:#1E8E3E; --yellow:#FBBC04; --red:#EA4335;
  --purple:#A142F4; --cyan:#12B5CB; --grey:#5F6368;
  --g50:#F8F9FA; --g100:#F1F3F4; --g200:#E8EAED; --g300:#DADCE0;
}
body[data-mode="work"]{
  --bg:#F7F9FC; --surface:#FFFFFF; --card:#FFFFFF; --sunken:#F1F5FB;
  --line:#DDE3EA; --line-soft:#EAEEF3;
  --ink:#202124; --ink-2:#5F6368; --ink-3:#80868B;
  --hot:#1A73E8; --hot-soft:#E8F0FE; --hot-line:#A8C7FA;
}
body[data-mode="personal"]{
  --bg:#F7FBF8; --surface:#FFFFFF; --card:#FFFFFF; --sunken:#EFF6F1;
  --line:#DCE5DE; --line-soft:#E9F0EB;
  --ink:#202124; --ink-2:#5F6368; --ink-3:#80868B;
  --hot:#1E8E3E; --hot-soft:#E6F4EA; --hot-line:#A8D5B5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:19px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding:0 44px 130px;transition:background .4s}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:6px;background:var(--hot);z-index:400;transition:background .4s}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px;border-radius:4px}
.wrap{max-width:1780px;margin:0 auto}

.top{display:flex;align-items:center;gap:24px;padding:32px 0 18px}
.modes{display:flex;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.mode-btn{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:13px 28px;border-radius:999px;color:var(--ink-3);transition:.2s}
.mode-btn:hover{background:var(--g100);color:var(--ink-2)}
.mode-btn.on,.mode-btn.on:hover{background:var(--hot);color:#fff}
.mode-btn .k{opacity:.55;margin-left:10px;font-weight:400}
.modehint{font-family:var(--mono);font-size:14px;color:var(--ink-3);padding:0 14px 0 10px;align-self:center;opacity:.7}
.grow{flex:1}
.ledger{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.ledger i{width:3px;height:17px;background:var(--ink-3);opacity:.35;border-radius:2px;display:inline-block;margin-right:2px}

.dump{position:relative;margin-top:10px;border-bottom:3px solid var(--line);transition:border-color .25s}
.dump:focus-within{border-color:var(--hot)}
.dump textarea{width:100%;resize:none;overflow:hidden;font-family:var(--serif);font-weight:300;
  font-size:clamp(30px,3vw,44px);line-height:1.35;padding:22px 180px 22px 0;min-height:96px;letter-spacing:-.015em}
.dump textarea::placeholder{color:var(--ink-3);font-style:italic;opacity:.65}
.dump-key{position:absolute;right:0;bottom:30px;font-family:var(--mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);opacity:0;transition:opacity .25s;pointer-events:none}
.dump:focus-within .dump-key{opacity:.85}
.dump.flash{animation:flash .5s ease}
@keyframes flash{0%,50%{border-color:var(--hot)}100%{border-color:var(--line)}}

.nav{display:flex;gap:34px;align-items:center;margin:26px 0 34px;border-bottom:2px solid var(--line-soft);flex-wrap:wrap}
.nav button.tab{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);padding:0 0 16px;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.nav button.tab:hover{color:var(--ink-2)}
.nav button.tab.on{color:var(--hot);border-color:var(--hot)}
.nav .n{margin-left:10px;opacity:.65;font-weight:400}
.nav .n.pulse{animation:pulse .7s cubic-bezier(.3,1.5,.4,1);display:inline-block}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.7);color:var(--hot);opacity:1}100%{transform:scale(1)}}
.nav .spacer{flex:1;min-width:12px}
.cap{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:9px 16px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);cursor:pointer;transition:.2s}
.cap:hover{border-color:var(--ink-3)}
.cap.full{border-color:var(--yellow);background:#FEF7E0}
.cap.over{border-color:var(--red);background:#FCE8E6}
.cap .num{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--ink-2);white-space:nowrap}
.cap.over .num{color:#C5221F}
.capbar{width:74px;height:7px;border-radius:4px;background:var(--g200);overflow:hidden;flex:none}
.capbar i{display:block;height:7px;background:var(--hot);transition:width .4s cubic-bezier(.4,0,.2,1)}
.cap.full .capbar i{background:var(--yellow)}
.cap.over .capbar i{background:var(--red)}
.cap .lbl{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sortbtn{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  background:var(--hot);color:#fff;padding:13px 24px;border-radius:999px;margin-bottom:12px;box-shadow:var(--shadow);white-space:nowrap}
.sortbtn:hover{filter:brightness(1.08)}

.split{display:grid;grid-template-columns:minmax(320px,.62fr) 1.8fr;gap:64px;align-items:start}
@media(max-width:1150px){.split{grid-template-columns:1fr;gap:44px}}
.railhead{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:18px}
.ritual-title{font-family:var(--serif);font-size:36px;font-weight:400;letter-spacing:-.02em;margin-bottom:22px;line-height:1.15}
.step{display:flex;gap:18px;align-items:center;padding:15px 8px;border-radius:10px;cursor:pointer;transition:background .15s}
.step:hover{background:var(--sunken)}
.step-tick{flex:none;width:26px;height:26px;border:2.5px solid var(--g300);border-radius:50%;position:relative;transition:.25s;background:var(--card)}
.step:hover .step-tick{border-color:var(--hot)}
.step.on .step-tick{background:var(--hot);border-color:var(--hot)}
.step.on .step-tick::after{content:'';position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(43deg);animation:pop .3s cubic-bezier(.3,1.7,.4,1)}
@keyframes pop{from{transform:rotate(43deg) scale(0)}to{transform:rotate(43deg) scale(1)}}
.step-n{font-family:var(--mono);font-size:14px;color:var(--ink-3);width:24px;flex:none}
.step-name{font-family:var(--serif);font-size:23px;font-weight:400;transition:.3s;flex:1;letter-spacing:-.01em}
.step.on .step-name{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:2px}
.bar{height:5px;background:var(--g200);margin-top:22px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:5px;background:var(--hot);transition:width .6s cubic-bezier(.4,0,.2,1)}
.barlabel{font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:12px}
.railacts{display:flex;flex-direction:column;gap:10px;margin-top:26px}

/* ---------- plan ---------- */
.daybar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:34px;padding-bottom:22px;border-bottom:1.5px solid var(--line-soft)}
.db-date{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.db-sp{flex:1;min-width:8px}
.db-ritual{display:flex;align-items:center;gap:13px;padding:11px 20px 11px 13px;border-radius:999px;
  border:1.5px solid var(--hot);background:var(--hot-soft);transition:.18s}
.db-ritual:hover{background:var(--card);box-shadow:var(--shadow)}
.db-ritual.complete{border-color:var(--line);background:var(--card)}
.db-ring{width:26px;height:26px;border-radius:50%;flex:none;
  background:conic-gradient(var(--hot) calc(var(--pct)*1%),var(--g200) 0);display:flex;align-items:center;justify-content:center}
.db-ring i{width:16px;height:16px;border-radius:50%;background:var(--card);display:block}
.db-rt{font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--hot);text-align:left;line-height:1.3}
.db-ritual.complete .db-rt{color:var(--ink-3)}
.db-rt em{display:block;font-style:normal;font-size:11.5px;font-weight:400;letter-spacing:.08em;color:var(--ink-3);margin-top:2px}
.db-chip{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:11px 20px;text-align:left;line-height:1.3;transition:.18s}
.db-chip:hover{border-color:var(--ink-3)}
.db-chip.flat{cursor:default}
.db-chip.flat:hover{border-color:var(--line)}
.db-chip em{display:block;font-style:normal;font-size:11.5px;font-weight:400;letter-spacing:.08em;color:var(--ink-3);margin-top:2px}
.db-chip.over{border-color:var(--yellow);background:#FEF7E0;color:#9A6700}
.planhead{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.planhead h2{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-.02em}
.planhead span{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.slotlabel{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 10px}
.streak{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:none;
  color:var(--ink-3);opacity:.55;transition:.25s}
.streak.lit{opacity:1;color:var(--hot)}
.secondary{margin-top:6px;opacity:.88}
.secondary .secondary-head{margin-top:36px;margin-bottom:4px;color:var(--ink-3);font-weight:600}
.secondary .slotlabel.sub{font-size:11.5px;margin:16px 0 8px;font-weight:500}
.slotlabel b{color:var(--hot)}
.deep{--cc:var(--hot);background:var(--card);border-radius:20px;border-top:8px solid var(--cc);padding:40px 42px 34px;
  box-shadow:var(--shadow-2);position:relative;overflow:hidden;min-height:150px}
.deep.empty{background:transparent;border:3px dashed var(--line);border-top:3px dashed var(--line);box-shadow:none;
  display:flex;flex-direction:column;justify-content:center;padding:34px 38px}
.deep .deep-t{font-family:var(--serif);font-size:clamp(30px,3.2vw,48px);font-weight:400;line-height:1.18;letter-spacing:-.025em;position:relative;z-index:2}
.deep .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px;position:relative;z-index:2}
.deep .acts{display:flex;gap:11px;margin-top:26px;position:relative;z-index:5;flex-wrap:wrap}
.deep .strike{left:0;right:0;top:auto;bottom:38%;height:44px}
.deep .strike path{stroke-width:5}
.deep .seal{width:62px;height:62px;font-size:30px;margin-top:-31px;right:24px}
.emptynote{font-family:var(--serif);font-size:26px;font-weight:300;color:var(--ink-3);font-style:italic}
.suggest{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.suggest .txt{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--ink-2)}

.slots{display:grid;gap:12px}
.slots.b3{grid-template-columns:repeat(3,1fr)}
.slots.b2{grid-template-columns:repeat(2,1fr);max-width:70%}
.slots.b1{grid-template-columns:1fr;max-width:46%}
@media(max-width:900px){.slots.b3,.slots.b2{grid-template-columns:1fr;max-width:none}}
.slot{background:var(--card);border-radius:var(--r);border-left:6px solid var(--cc,var(--grey));padding:18px 18px 50px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:132px;display:flex;flex-direction:column}
.slot.empty{min-height:124px;background:transparent;border:2.5px dashed var(--line);border-left:2.5px dashed var(--line);box-shadow:none;
  align-items:center;justify-content:center;color:var(--ink-3);font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.slot.next{opacity:.62}
.slot.next:hover{opacity:1}
.slot .st{font-family:var(--serif);font-size:19px;font-weight:300;line-height:1.35;flex:1;position:relative;z-index:2}
.slot .sf{margin-top:12px;position:relative;z-index:2}
.slot .strike{left:10px;right:10px;top:14px;height:26px}
.slot .seal{width:36px;height:36px;font-size:18px;margin-top:-18px;right:10px}
.slot.over,.deep.over{box-shadow:0 0 0 3px var(--hot-line),var(--shadow)}

/* ---------- rest of board, faded ---------- */
.rest{margin-top:38px;padding-top:22px;border-top:1.5px solid var(--line-soft)}
.rest h3{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.restgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:32px 30px}
.restgroup h4{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:10px;padding-bottom:7px;border-bottom:1.5px solid var(--line-soft);display:flex;align-items:center;gap:9px}
.restgroup h4 b{width:8px;height:8px;border-radius:50%;background:currentColor}
.restgroup h4 span{margin-left:auto;color:var(--ink-3);font-weight:400}
.restgroup h4 em{font-style:normal;font-size:11px;letter-spacing:.08em;color:#9A6700;background:#FEF7E0;
  padding:3px 9px;border-radius:999px;margin-left:8px;font-weight:600}
.mini{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;opacity:.55;
  transition:.15s;cursor:grab;font-size:17px}
.mini:hover{opacity:1;background:var(--card);box-shadow:var(--shadow);z-index:10}
.mini .d{width:9px;height:9px;border-radius:50%;flex:none}
.mini .t{flex:1;min-width:0;font-family:var(--serif);font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .floatbar{bottom:50%;transform:translateY(50%) scale(.98)}
.mini:hover .floatbar{transform:translateY(50%)}
.mini .tag{flex:none;white-space:nowrap}
.mini.drag{opacity:.25}

/* ---------- columns ---------- */
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(336px,1fr);gap:18px;overflow-x:auto;padding-bottom:24px;align-items:start}
.col{background:var(--sunken);border-radius:16px;padding:18px 14px 14px;min-height:220px;transition:background .2s,box-shadow .2s}
.col.over{background:var(--hot-soft);box-shadow:inset 0 0 0 2.5px var(--hot-line)}
.col-head{display:flex;align-items:center;gap:11px;padding:0 8px 14px;margin-bottom:12px;border-bottom:1.5px solid var(--line)}
.col-name{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
.col-n{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--ink-3)}
.col-empty{padding:20px 8px;font-size:16px;color:var(--ink-3);font-style:italic}
.ph{border-radius:var(--r);background:var(--hot-soft);border:2.5px dashed var(--hot-line);margin-bottom:12px;height:0;overflow:hidden;transition:height .18s cubic-bezier(.2,.8,.3,1)}
.addbtn{display:flex;align-items:center;gap:10px;width:100%;padding:13px 12px;border-radius:10px;color:var(--ink-3);
  font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;transition:.15s}
.addbtn:hover{background:var(--card);color:var(--hot);box-shadow:var(--shadow)}
.composer{background:var(--card);border:2px solid var(--hot);border-radius:var(--r);padding:14px;box-shadow:var(--shadow-2)}
.composer textarea{width:100%;resize:none;overflow:hidden;font-family:var(--serif);font-size:21px;font-weight:300;line-height:1.35;min-height:52px}
.composer .hint{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}

.card{--cc:var(--grey);background:var(--card);border-radius:var(--r);border-left:6px solid var(--cc);
  padding:20px 22px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;
  transition:box-shadow .18s,transform .18s;width:100%;min-height:78px;display:flex;flex-direction:column}
.card::after{content:'';position:absolute;inset:0;background:var(--tint,transparent);opacity:.09;pointer-events:none}
.slot::after,.deep::after{content:'';position:absolute;inset:0;background:var(--tint,transparent);opacity:.09;pointer-events:none;z-index:0}
.card:hover{box-shadow:var(--shadow-2);transform:translateY(-2px)}
.card.drag{opacity:.25}
.card-top{display:flex;gap:14px;align-items:center;position:relative;z-index:2}
.vdot{position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--yellow);z-index:3;opacity:.9}
.dtext{width:100%;font-family:var(--serif);font-size:30px;font-weight:300;line-height:1.25;border-bottom:2.5px solid var(--line);
  padding:6px 0 14px;margin-bottom:8px;resize:none;overflow:hidden;letter-spacing:-.015em}
.dtext:focus{border-color:var(--hot)}
.dsec{margin-top:24px}
.dsec:first-of-type{margin-top:18px}
.sprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--g200);z-index:3}
.sprog i{display:block;height:4px;background:var(--cc);transition:width .3s}
.stepline{display:flex;align-items:center;gap:12px;padding:7px 0}
.sbox{flex:none;width:22px;height:22px;border:2.5px solid var(--g300);border-radius:6px;position:relative;transition:.18s;background:var(--card)}
.sbox:hover{border-color:var(--hot)}
.sbox.on{background:var(--hot);border-color:var(--hot)}
.sbox.on::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
.sinput{flex:1;font-family:var(--serif);font-size:19px;font-weight:300;padding:4px 0;border-bottom:1px solid transparent}
.sinput:focus{border-color:var(--hot)}
.sinput.done{color:var(--ink-3);text-decoration:line-through}
.snew{width:100%;font-family:var(--serif);font-size:19px;font-weight:300;padding:10px 0 8px;
  border-bottom:2px dashed var(--line);margin-top:6px;color:var(--ink)}
.snew:focus{border-color:var(--hot);border-style:solid}
.snew::placeholder{color:var(--ink-3);font-style:italic}
.tick{flex:none;width:26px;height:26px;margin-top:2px;border:2.5px solid var(--g300);border-radius:50%;background:var(--card);transition:.18s}
.tick:hover{border-color:var(--cc);background:var(--cc);box-shadow:0 0 0 5px color-mix(in srgb,var(--cc) 22%,transparent)}
.card-text{font-family:var(--serif);font-size:22px;font-weight:300;line-height:1.35;flex:1;word-break:break-word;letter-spacing:-.01em}
.card-text[contenteditable="true"]{box-shadow:0 2px 0 var(--hot);cursor:text}
.card-sub{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 96px 0 40px;position:relative;z-index:2}
.floatbar{position:absolute;right:12px;bottom:12px;width:max-content;max-width:calc(100% - 24px);
  display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:flex-end;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow-2);

body.dragging .dropbar{bottom:30px;pointer-events:auto}
.dropbar.hot{border-color:var(--hot);color:var(--hot);background:var(--hot-soft);border-style:solid}
.foot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:70px;padding-top:26px;border-top:1.5px solid var(--line-soft)}
.foot .meta{font-family:var(--mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:auto}
.foot .meta.warn{color:var(--red);font-weight:600}
.alarm{border:2px solid var(--red);background:#FCE8E6;color:#C5221F;padding:18px 22px;border-radius:var(--r);margin:20px 0;font-size:18px}
.empty{padding:44px 0;max-width:48ch}
.empty h3{font-family:var(--serif);font-size:30px;font-weight:400;margin-bottom:14px;letter-spacing:-.02em}
.empty p{color:var(--ink-2);font-size:18px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#202124;color:#fff;border-radius:999px;
  padding:14px 26px;font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  z-index:600;animation:tin .3s;display:flex;align-items:center;gap:18px}
.toast .undo{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:#8AB4F8;padding:2px 4px}
.toast .undo:hover{color:#fff;text-decoration:underline}
.donerow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.donerow .d{width:9px;height:9px;border-radius:50%;flex:none;opacity:.6}
.donerow .t{flex:1;min-width:0;font-family:var(--serif);font-size:18px;font-weight:300;color:var(--ink-2);
  text-decoration:line-through;text-decoration-color:var(--g300);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donerow .act{opacity:.5}
.donerow:hover .act{opacity:1}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:760px){body{padding:0 18px 110px}.deep{padding:26px 22px}.keysbox{left:14px;bottom:14px}.sheet{padding:26px 22px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-mode="work">
<div id="app"></div>
<div id="layer"></div>
<div id="dplayer"></div>
<div id="mlayer"></div>
<div class="keysbox" id="keysbox"></div>
<script src="/app_1.js"></script></body>
</html>
